<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="t d">
  <title id="t">schema-infer two-stage inference</title>
  <desc id="d">Files or stdin are read by parse.ts into samples. observe.ts folds every sample into an Observation tree of evidence: type counts, key presence counts, surviving string formats from formats.ts, distinct values capped at 64, and observed bounds. Only after all samples are read, infer.ts turns the tree into a JSON Schema 2020-12 document: required when a key was present in every object, format only if every string matched, enum only with enough repeated evidence, bounds only with --bounds.</desc>
  <rect width="1200" height="430" fill="#0C0D0D"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#A3AAA6"/>
    </marker>
  </defs>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" fill="#EEEAE2">
    <text x="40" y="44">schema-infer</text>
  </g>
  <text x="170" y="44" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" fill="#A3AAA6">stage 1 records evidence, stage 2 makes claims only after every sample is read</text>

  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13">
    <!-- input -->
    <rect x="40" y="120" width="170" height="130" rx="6" fill="#17191A" stroke="#2A2E2D"/>
    <text x="56" y="148" fill="#EEEAE2">input</text>
    <text x="56" y="174" fill="#A3AAA6">file.json</text>
    <text x="56" y="196" fill="#A3AAA6">events.ndjson</text>
    <text x="56" y="218" fill="#A3AAA6">stdin</text>

    <!-- parse -->
    <rect x="250" y="120" width="190" height="130" rx="6" fill="#17191A" stroke="#2A2E2D"/>
    <text x="266" y="148" fill="#EEEAE2">parse.ts</text>
    <text x="266" y="174" fill="#A3AAA6">parseSamples</text>
    <text x="266" y="196" fill="#A3AAA6">JSON / NDJSON auto</text>
    <text x="266" y="218" fill="#A3AAA6">unwrap top array</text>
    <text x="266" y="240" fill="#A3AAA6">ParseError(line)</text>

    <!-- observe -->
    <rect x="480" y="90" width="250" height="220" rx="6" fill="#17191A" stroke="#2A2E2D"/>
    <text x="496" y="118" fill="#EEEAE2">observe.ts</text>
    <text x="620" y="118" fill="#A3AAA6">evidence</text>
    <text x="496" y="146" fill="#A3AAA6">Observation tree</text>
    <text x="496" y="172" fill="#A3AAA6">types: Set&lt;JsonType&gt;</text>
    <text x="496" y="194" fill="#A3AAA6">propertyCounts / objectCount</text>
    <text x="496" y="216" fill="#A3AAA6">formats still matching</text>
    <text x="496" y="238" fill="#A3AAA6">values (max 64 distinct)</text>
    <text x="496" y="260" fill="#A3AAA6">min/max, lengths, items</text>
    <text x="496" y="290" fill="#A3AAA6">no judgements</text>

    <!-- formats -->
    <rect x="480" y="336" width="250" height="56" rx="6" fill="#17191A" stroke="#2A2E2D"/>
    <text x="496" y="360" fill="#EEEAE2">formats.ts</text>
    <text x="496" y="380" fill="#A3AAA6">8 strict string predicates</text>

    <!-- infer -->
    <rect x="770" y="90" width="230" height="220" rx="6" fill="#17191A" stroke="#3FBF8A"/>
    <text x="786" y="118" fill="#EEEAE2">infer.ts</text>
    <text x="890" y="118" fill="#A3AAA6">judgement</text>
    <text x="786" y="146" fill="#A3AAA6">required: seen in</text>
    <text x="786" y="166" fill="#A3AAA6">  every object</text>
    <text x="786" y="192" fill="#A3AAA6">format: every string</text>
    <text x="786" y="212" fill="#A3AAA6">  matched</text>
    <text x="786" y="238" fill="#A3AAA6">enum: 3+ samples,</text>
    <text x="786" y="258" fill="#A3AAA6">  a repeat, no format</text>
    <text x="786" y="284" fill="#A3AAA6">bounds: --bounds only</text>

    <!-- output -->
    <rect x="1040" y="140" width="130" height="120" rx="6" fill="#17191A" stroke="#2A2E2D"/>
    <text x="1056" y="168" fill="#EEEAE2">Schema</text>
    <text x="1056" y="194" fill="#A3AAA6">JSON Schema</text>
    <text x="1056" y="214" fill="#A3AAA6">2020-12</text>
    <text x="1056" y="240" fill="#A3AAA6">stdout</text>
  </g>

  <g stroke="#A3AAA6" stroke-width="1.5" fill="none" marker-end="url(#a)">
    <path d="M210 185 H246"/>
    <path d="M440 185 H476"/>
    <path d="M605 336 V314"/>
    <path d="M730 200 H766"/>
    <path d="M1000 200 H1036"/>
  </g>
  <text x="40" y="380" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#A3AAA6">cli.ts wires flags to InferOptions</text>
</svg>
